name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            ext: ""
            name: krokodyl-linux
            build_flags: "-tags webkit2_41"
          - os: windows-latest
            platform: windows/amd64
            ext: ".exe"
            name: krokodyl-windows.exe
            build_flags: ""
          - os: macos-latest
            platform: darwin/universal
            ext: ""
            name: krokodyl-macos
            build_flags: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        # Keep this version in sync with github.com/wailsapp/wails/v2 in go.mod
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build application (macOS)
        if: matrix.os == 'macos-latest'
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.build_flags }}

      - name: Build application (Linux/Windows)
        if: matrix.os != 'macos-latest'
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.build_flags }} -o krokodyl${{ matrix.ext }}

      - name: Prepare macOS artifact
        if: matrix.os == 'macos-latest'
        run: |
          echo "Contents of build/bin directory:"
          ls -la build/bin/

          if [ ! -d "build/bin/krokodyl.app" ]; then
            echo "ERROR: build/bin/krokodyl.app not found - refusing to ship a bare binary"
            find build/ -type f -name "*krokodyl*" || true
            exit 1
          fi

          # Ad-hoc signature (no Apple Developer account). Gives the bundle a
          # stable identity so the right-click -> Open path works cleanly,
          # including on Apple Silicon.
          codesign --force --deep --sign - build/bin/krokodyl.app
          codesign --verify --verbose build/bin/krokodyl.app

          # ditto preserves the bundle structure and extended attributes.
          ditto -c -k --keepParent build/bin/krokodyl.app build/bin/krokodyl-macos-universal.zip

      - name: Upload artifact (Linux/Windows)
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/bin/krokodyl${{ matrix.ext }}
          retention-days: 1

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/bin/krokodyl-macos-universal.zip
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    # workflow_dispatch runs build artifacts only; releases come from tags.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Linux
          if [ -f "artifacts/krokodyl-linux/krokodyl" ]; then
            cp artifacts/krokodyl-linux/krokodyl release/krokodyl-linux
            chmod +x release/krokodyl-linux
          fi
          # Windows
          if [ -f "artifacts/krokodyl-windows.exe/krokodyl.exe" ]; then
            cp artifacts/krokodyl-windows.exe/krokodyl.exe release/krokodyl-windows.exe
          fi
          # macOS
          if [ -f "artifacts/krokodyl-macos/krokodyl-macos-universal.zip" ]; then
            cp artifacts/krokodyl-macos/krokodyl-macos-universal.zip release/krokodyl-macos-universal.zip
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Installing on macOS

            The macOS app is not notarized, so macOS shows a warning on first launch:

            1. Download and unzip `krokodyl-macos-universal.zip`
            2. Right-click `krokodyl.app` → **Open** → **Open**

            This is only needed once. If transfers misbehave, please attach
            `~/Library/Caches/krokodyl/krokodyl.log` to your bug report.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
